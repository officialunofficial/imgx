name: CI image

# Builds the image that the CI and release jobs run in, so no job runs apt
# against the Ubuntu mirror. The tag is a hash of .github/ci/Dockerfile. A
# changed Dockerfile gets a new tag, which this workflow builds and pushes
# before any job uses it.
on:
  workflow_call:
    outputs:
      image:
        description: The image reference, tagged by the Dockerfile hash.
        value: ${{ jobs.ci-image.outputs.image }}

permissions:
  contents: read

jobs:
  ci-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image reference
        id: ref
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          hash=$(sha256sum .github/ci/Dockerfile | cut -c1-12)
          echo "image=ghcr.io/${owner}/imgx-ci:${hash}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push if the tag is new
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE already exists"
          else
            docker build -t "$IMAGE" .github/ci
            docker push "$IMAGE"
          fi
