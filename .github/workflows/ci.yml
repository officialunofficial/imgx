name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # sccache and incremental compilation are incompatible ("incremental
  # compilation is prohibited: Unset CARGO_INCREMENTAL to continue").
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # The jobs below run in the image that ci-image.yml builds.
  ci-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  # The Rust version is pinned to the same value in rust-version
  # (Cargo.toml), msrv (clippy.toml), channel (rust-toolchain.toml) and every
  # job below, so clippy on this toolchain also checks the MSRV. There is no
  # separate msrv job.
  lint:
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  coverage:
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2

      # Visibility only for now, no --fail-under-* threshold -- this
      # establishes a baseline before turning it into a hard gate.
      - name: Generate coverage summary
        run: cargo llvm-cov --workspace --summary-only >> "$GITHUB_STEP_SUMMARY"

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # cargo-deny-action runs cargo inside its own Docker container, which
    # doesn't have sccache installed -- the workflow-level RUSTC_WRAPPER
    # env leaking in here makes every rustc invocation fail immediately
    # ("could not execute process `sccache ...`"). This job doesn't
    # compile anything itself, so there's nothing sccache would help with
    # anyway; just unset it.
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: ""
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    needs: [ci-image, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release -p imgx
