name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # sccache and incremental compilation are incompatible ("incremental
  # compilation is prohibited: Unset CARGO_INCREMENTAL to continue").
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      # libheif-plugin-aomenc is the AV1 encoder that AVIF output needs. It
      # is only a Recommends dependency of libheif-dev, so name it here. A
      # plain apt-get install replaces cache-apt-pkgs-action, which restored
      # an empty cache entry (5 KB) as a hit and installed no packages.
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libheif-plugin-aomenc

      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in sync with rust-version in Cargo.toml, msrv in clippy.toml,
      # and channel in rust-toolchain.toml. Every job pins the same Rust
      # version, so the MSRV is the toolchain.
      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2

      - name: Check on MSRV
        run: cargo check --workspace --all-targets

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: llvm-tools-preview

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libheif-plugin-aomenc

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2

      # Visibility only for now, no --fail-under-* threshold -- this
      # establishes a baseline before turning it into a hard gate.
      - name: Generate coverage summary
        run: cargo llvm-cov --workspace --summary-only >> "$GITHUB_STEP_SUMMARY"

  deny:
    runs-on: ubuntu-latest
    # cargo-deny-action runs cargo inside its own Docker container, which
    # doesn't have sccache installed -- the workflow-level RUSTC_WRAPPER
    # env leaking in here makes every rustc invocation fail immediately
    # ("could not execute process `sccache ...`"). This job doesn't
    # compile anything itself, so there's nothing sccache would help with
    # anyway; just unset it.
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: ""
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release -p imgx
