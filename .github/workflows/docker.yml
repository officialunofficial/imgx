name: Build and push Docker image

on:
  push:
    branches: [main]
    # release-plz tags releases as `imgx-vX.Y.Z` (package-prefixed, since
    # imgx-vips is tagged separately in the same repo) -- not the bare
    # `vX.Y.Z` this previously matched, which never fired.
    tags: ["imgx-v[0-9]*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Docker-maintained reusable workflow: distributes the build across
    # native per-platform runners (linux/arm64 -> ubuntu-24.04-arm by
    # default) instead of QEMU emulation, which is what made aws-lc-sys
    # (reqwest's rustls crypto backend, compiled via cmake) painfully slow
    # to build for arm64. Also gives us signed SLSA provenance for free.
    # https://github.com/docker/github-builder
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: latest=false
      meta-tags: |
        type=ref,event=branch
        type=match,pattern=^imgx-v([0-9].*)$,group=1
        type=sha
      cache: true
      cache-mode: max
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release-toolchain:
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  verify-release:
    needs: [build, release-toolchain]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
      TOOLCHAIN: ${{ needs.release-toolchain.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Run goldens against the pushed release
        run: test/goldens-runtime.sh "$TOOLCHAIN" "$IMAGE"

      - name: Smoke test the pushed release
        run: |
          test/smoke-runtime.sh "$IMAGE"
          IMGX_TRANSFORM_STATIC_LADDER=true test/smoke-runtime.sh "$IMAGE"

  publish-release-image:
    needs: [build, verify-release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/${{ github.repository }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Add the verified image digest to the release notes
        run: |
          # The tag can arrive before release-plz creates the GitHub release.
          for attempt in {1..12}; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              exit 1
            fi
            sleep 5
          done
          awk '/^<!-- imgx-container-image -->$/{exit} {print}' release-notes.md > release-body.md
          printf '\n<!-- imgx-container-image -->\n### Container image\n\n%s@%s\n' "$IMAGE" "$DIGEST" >> release-body.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-body.md

      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at the verified multi-platform image
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

  scan:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scans by digest (from the build job's output), not a tag -- the
      # exact multi-arch image that was just pushed, not whatever a
      # mutable tag happens to point at by the time this job runs.
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.39.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
